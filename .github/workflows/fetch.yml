name: Veri cekimi

on:
  schedule:
    # Her 3 saatte bir (UTC). Dakika 17: herkesin kullandığı :00 yoğunluğundan kaçınmak için.
    - cron: "17 */3 * * *"
  # Actions sekmesinden elle çalıştırmak için "Run workflow" düğmesi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veri-cekimi
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verileri cek
        run: python scripts/fetch_data.py

      - name: Degisiklikleri depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Veri guncellendi: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
